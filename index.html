/* ===== Firebase körpüsü (Mərhələ 2) =====
   Köhnə claude.use() çağırışları indi Firebase ilə işləyir. Bu skript oyunun qalan kodundan əvvəl yüklənir. */
window.__fbReady=new Promise(r=>{window.__fbResolve=r});
window.claude={use:async n=>{const a=await window.__fbReady;return a?a.use(n):null}};
setTimeout(()=>window.__fbResolve(null),20000);

<script type="module">
const V="12.15.0",CDN="https://www.gstatic.com/firebasejs/"+V+"/";
/* Bu açıq veb-konfiqurasiyadır (gizli deyil). Təhlükəsizliyi Firestore Rules təmin edir. */
const firebaseConfig={
  apiKey:"AIzaSyAmMXBIXcEGXsFp17Fps3nB1acAGfAYdu4",              
  authDomain:"onlinetaptap-5029f.firebaseapp.com",
  projectId:"onlinetaptap-5029f"
};
if(firebaseConfig.apiKey.startsWith("BURAYA_")){
  const d=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 14px;font:700 13px system-ui;text-align:center";
  d.textContent="Firebase apiKey yazılmayıb: index.html-də firebaseConfig hissəsinə apiKey əlavə edin.";document.addEventListener("DOMContentLoaded",()=>document.body.prepend(d));
  window.__fbResolve(null);throw new Error("firebase apiKey yoxdur");
}
(async()=>{try{
const [{initializeApp},AU,FS]=await Promise.all([import(CDN+"firebase-app.js"),import(CDN+"firebase-auth.js"),import(CDN+"firebase-firestore.js")]);
const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,updatePassword,reauthenticateWithCredential,EmailAuthProvider,deleteUser}=AU;
const {initializeFirestore,doc,collection,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,addDoc,runTransaction}=FS;
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=initializeFirestore(app,{ignoreUndefinedProperties:true});
try{await getRedirectResult(auth)}catch(e){window.__fbRedirectErr=e}
await auth.authStateReady();

/* ---- Firestore adapteri: köhnə db.doc()/db.collection() interfeysi ---- */
const mp=p=>p.replace(/^players(\/|$)/,"users$1");               /* köhnə "players" -> "users" */
const OPS={eq:"==",ne:"!=",lt:"<",lte:"<=",gt:">",gte:">=","in":"in","not-in":"not-in","array-contains":"array-contains"};
const wDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const wQ=s=>{const docs=s.docs.map(wDoc);return{docs,empty:!docs.length,size:docs.length,forEach:f=>docs.forEach(f)}};
function mkDoc(p){const r=doc(fs,p);return{id:r.id,path:p,
  get:async()=>wDoc(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),
  collection:c=>mkQuery(p+"/"+c,[]),onSnapshot:(cb,er)=>onSnapshot(r,s=>cb(wDoc(s)),er||(()=>{}))}}
function mkQuery(p,cs){const q=()=>cs.length?query(collection(fs,p),...cs):collection(fs,p);
  return{orderBy:(f,d)=>mkQuery(p,[...cs,orderBy(f,d||"asc")]),limit:n=>mkQuery(p,[...cs,limit(n)]),
   where:(f,o,v)=>mkQuery(p,[...cs,where(f,OPS[o]||o,v)]),
   get:async()=>wQ(await getDocs(q())),onSnapshot:(cb,er)=>onSnapshot(q(),s=>cb(wQ(s)),er||(()=>{})),
   add:async d=>{const r=await addDoc(collection(fs,p),d);return mkDoc(p+"/"+r.id)},doc:id=>mkDoc(p+"/"+id)}}
const dbA={doc:p=>mkDoc(mp(p)),collection:p=>mkQuery(mp(p),[])};
const userA={me:async()=>{const u=auth.currentUser;return{id:u?u.uid:"",isOwner:false,name:u&&u.displayName||""}},canEdit:async()=>false};

/* ---- Profil yaratmaq (ad və oyunçu ID unikal olmalıdır) ---- */
async function createProfile(uid,name){
  for(let i=0;i<8;i++){const pid=String(100000+Math.floor(Math.random()*900000));
    try{await runTransaction(fs,async tx=>{
        const idr=doc(fs,"ids",pid);if((await tx.get(idr)).exists())throw{code:"app/retry"};
        let nr=null;if(name){nr=doc(fs,"names",name.toLowerCase());if((await tx.get(nr)).exists())throw{code:"app/name-taken"}}
        const prof={uid,pid,lvl:1,createdAt:Date.now()};if(name){prof.name=name;prof.nameAt=Date.now()}
        tx.set(idr,{uid});tx.set(doc(fs,"users",uid),prof);if(nr)tx.set(nr,{uid})});
      return pid}catch(e){if(e&&e.code==="app/retry")continue;throw e}}
  throw{code:"app/id-fail"}}
const NAMERE=/^[\p{L}\p{N}_]{3,16}$/u;
async function ensureProfile(){const u=auth.currentUser;if(!u)return null;
  const s=await getDoc(doc(fs,"users",u.uid));if(s.exists())return s.data();
  const base=String(u.displayName||"").replace(/[^\p{L}\p{N}_]/gu,"").slice(0,14);
  const tries=NAMERE.test(base)?[base,base+Math.floor(10+Math.random()*90)]:[];
  for(const n of tries){try{await createProfile(u.uid,n);return(await getDoc(doc(fs,"users",u.uid))).data()}catch(e){if(!e||e.code!=="app/name-taken")throw e}}
  await createProfile(u.uid,null);return(await getDoc(doc(fs,"users",u.uid))).data()}

/* ---- Oyun kodunun istifadə etdiyi giriş funksiyaları ---- */
window.FBA={auth,
  user:()=>auth.currentUser,
  hasPw:()=>!!auth.currentUser&&auth.currentUser.providerData.some(p=>p.providerId==="password"),
  profile:async()=>{const u=auth.currentUser;if(!u)return null;const s=await getDoc(doc(fs,"users",u.uid));return s.exists()?s.data():null},
  async signUp(name,email,pw){const c=await createUserWithEmailAndPassword(auth,email,pw);
    try{const pid=await createProfile(c.user.uid,name);return{pid}}catch(e){try{await deleteUser(c.user)}catch(_){}throw e}},
  async signIn(email,pw){await signInWithEmailAndPassword(auth,email,pw);await ensureProfile()},
  async google(){const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await signInWithPopup(auth,p)}catch(e){
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){await signInWithRedirect(auth,p);return"redirect"}throw e}
    await ensureProfile();return"ok"},
  reset:email=>sendPasswordResetEmail(auth,email),
  out:()=>signOut(auth),
  async changePw(old,nw){const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,old));await updatePassword(u,nw)},
  async loadSave(){const u=auth.currentUser;if(!u)return null;const s=await getDoc(doc(fs,"saves",u.uid));return s.exists()?s.data():null},
  async putSave(sv){const u=auth.currentUser;if(!u)return 0;const t=Date.now();await setDoc(doc(fs,"saves",u.uid),{sv,t});return t},
  async deleteAccount(){const u=auth.currentUser;if(!u)return;
    const last=Date.parse(u.metadata&&u.metadata.lastSignInTime||"")||0;
    if(Date.now()-last>5*60*1000)throw{code:"auth/requires-recent-login"};
    const p=await getDoc(doc(fs,"users",u.uid)),d=p.exists()?p.data():{};
    if(d.name)await deleteDoc(doc(fs,"names",String(d.name).toLowerCase())).catch(()=>{});
    if(d.pid)await deleteDoc(doc(fs,"ids",d.pid)).catch(()=>{});
    await deleteDoc(doc(fs,"saves",u.uid)).catch(()=>{});
    await deleteDoc(doc(fs,"users",u.uid)).catch(()=>{});
    await deleteUser(u)}};

if(auth.currentUser){try{await ensureProfile()}catch(e){console.warn("profil",e)}}
window.__fbResolve({use:n=>n==="db"?dbA:n==="user"?userA:null});   /* assets/room/sample: sonrakı mərhələlərdə */
}catch(e){console.error("Firebase yüklənmədi:",e);window.__fbResolve(null)}})();
</script>

@keyframes drift{to{transform:translate(60vw,-30vh) scale(1.3)}}
.top{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -12px 6px;padding:6px 12px 8px;background:linear-gradient(var(--bg),transparent)}
.pill{border:0;background:linear-gradient(180deg,var(--solid),color-mix(in srgb,var(--solid) 86%,var(--ac)));box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.6);font-weight:900}
.wrap .panel{border:2px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;box-shadow:var(--sh2);perspective:800px}
.wrap .panel::before{content:"";position:absolute;z-index:2;left:16px;top:16px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 13px/26px var(--font);text-align:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 3px 10px rgba(0,0,0,.3);pointer-events:none;opacity:.92}
#wrap .panel:nth-child(1)::before{content:"1"}#wrap .panel:nth-child(2)::before{content:"2"}
#wrap.enter .panel{animation:panelIn .65s var(--ease) both}#wrap.enter .panel:nth-child(2){animation-delay:.1s}
@keyframes panelIn{from{opacity:0;transform:translateY(22px) scale(.95)}}
#wrap.enter~#msg{animation:up .5s .15s var(--ease) both}
#wrap.enter~.shop button{animation:up .5s var(--ease) both}
#wrap.enter~.shop button:nth-child(2){animation-delay:.06s}#wrap.enter~.shop button:nth-child(3){animation-delay:.12s}#wrap.enter~.shop button:nth-child(4){animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
#msg{font-weight:800;font-size:16px}
#msg.busy::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;border:2.5px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
svg circle[stroke="#1f9d55"]{pathLength:1;stroke-dasharray:1;stroke-dashoffset:1;stroke-width:2.2;filter:drop-shadow(0 0 3px #1f9d55);animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg circle.rg{stroke-dasharray:none;stroke-dashoffset:0;transform-box:fill-box;transform-origin:center;animation:rg .8s ease-out forwards}
@keyframes rg{to{transform:scale(2.4);opacity:0}}
svg circle[stroke="#e5484d"]{filter:drop-shadow(0 0 3px #e5484d);animation:hp 1.2s ease-in-out infinite}
@keyframes hp{50%{opacity:.35}}
.main{position:relative;overflow:hidden}
.main::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{40%,100%{transform:translateX(130%)}}
.shop button{border:0;background:linear-gradient(180deg,var(--solid),color-mix(in srgb,var(--solid) 84%,var(--ac)));box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.6)}
.shop button:hover:not(:disabled){transform:translateY(-3px)}
.shop button.arm{background:linear-gradient(180deg,#ffe08a,#ffc83d);color:#3a2600}
.sheet>*{animation:up .5s var(--ease) both}.sheet>*:nth-child(2){animation-delay:.05s}.sheet>*:nth-child(3){animation-delay:.1s}.sheet>*:nth-child(4){animation-delay:.15s}.sheet>*:nth-child(5){animation-delay:.2s}.sheet>*:nth-child(n+6){animation-delay:.25s}
.card{background:linear-gradient(180deg,var(--solid),color-mix(in srgb,var(--solid) 92%,var(--ac)));border:0;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.it2{transition:transform .2s var(--ease),box-shadow .2s}.it2:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.rk.me{background:linear-gradient(90deg,rgba(140,116,255,.2),transparent)}
#nav{background:color-mix(in srgb,var(--solid) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:0;box-shadow:0 -10px 30px rgba(40,40,90,.12)}
#nav button.on{background:linear-gradient(180deg,rgba(140,116,255,.25),rgba(47,168,255,.12))}
#nav button span{font-weight:800}
#ov,#lose,#pw{animation:fadeBg .3s ease both}@keyframes fadeBg{from{opacity:0}}
#ov div,#lose div,#pw div{background:linear-gradient(180deg,var(--solid),color-mix(in srgb,var(--solid) 90%,var(--ac)));box-shadow:0 30px 80px rgba(20,10,80,.4)}
#ov h2{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pill.bump{animation:bp .45s var(--ease)}
::selection{background:rgba(140,116,255,.35)}
</style>
<style id="v45">
.top,.pill,.panel,.wrap .panel,#nav,#msg,#ov,#lose,#pw,#dl{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.top{background:var(--bg)}#nav{background:var(--solid)}
body::after{animation:none;filter:none;opacity:.5}
svg circle[stroke="#e5484d"],svg circle[stroke="#1f9d55"]{filter:none}
#ov .main{animation:none}
.fl,.fl2{display:none!important}
.cf{position:fixed;left:0;top:0;z-index:70;font-size:22px;font-style:normal;line-height:1;pointer-events:none;will-change:transform,opacity}
.pill.hit{animation:hit .3s var(--ease)}@keyframes hit{50%{transform:scale(1.14)}}
#wrap.enter .panel{will-change:transform,opacity}
.rp,.pt{will-change:transform,opacity}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="pill">🏁 <span data-i="level"></span> <b id="lv">1</b></div><div class="pill coin">🪙 <b id="co">0</b></div><div class="pill" id="wr">✖ 0/3</div></header>
<div class="wrap" id="wrap"><div class="panel"><svg id="a" viewBox="0 0 100 80"></svg></div><div class="panel"><svg id="b" viewBox="0 0 100 80"></svg></div></div>
<div id="msg"></div>
<div class="shop"><button id="h0">🧭 <span data-i="dir"></span><small>8 🪙</small></button><button id="h1">💡 <span data-i="zone"></span><small>15 🪙</small></button><button id="h2">🎯 <span data-i="show"></span><small>40 🪙</small></button><button id="h3">⏭ <span data-i="skip"></span><small>60 🪙</small></button></div>
<div class="ai" id="src"></div></div>
<nav id="nav"><button data-t="game" class="on">🎮<span data-i="play"></span></button><button data-t="lb">🏆<span data-i="rank"></span></button><button data-t="sh">🛍<span data-i="shop"></span></button><button data-t="ch">💬<span data-i="chat"></span></button><button data-t="pf">👤<span data-i="pf"></span></button></nav>
<div class="sheet" id="lb"><h2>🏆 <span data-i="rank"></span></h2><div class="lg" id="lbt" style="grid-template-columns:1fr 1fr;margin-bottom:8px"><button data-w="1" class="on" data-i="weekly"></button><button data-w="0" data-i="overall"></button></div><div id="top" class="card"></div><div id="lbl"></div></div>
<div class="sheet" id="ch"><h2>💬 <span data-i="chat"></span></h2><div id="cl" class="card"></div><div style="display:flex;gap:8px"><input type="text" id="ci" maxlength="200"><button class="main" id="cs" style="padding:0 16px"></button></div><div id="cn" style="color:var(--mut);margin-top:6px"></div></div>
<div class="sheet" id="sh"><h2>🛍 <span data-i="shop"></span></h2><div class="card" id="gp" style="color:var(--mut)"></div><h3 data-i="tasks"></h3><div id="tkl"></div><h3 data-i="avatars"></h3><div class="grid" id="avl"></div><h3 data-i="frames"></h3><div class="grid" id="frl"></div></div>
<div class="sheet" id="pf"><h2>👤 <span data-i="pf"></span></h2><div class="card" style="text-align:center"><div id="pav"></div><div id="pnm" style="font-weight:800;font-size:20px;margin-top:6px"></div><div style="color:var(--mut);margin-top:4px"><span data-i="pid"></span>: <b id="pidv"></b> <button id="pcp" style="padding:2px 10px"></button></div></div><div class="card" id="pst"></div><button id="pset" style="width:100%;padding:12px">⚙️ <span data-i="set"></span></button></div>
<div class="sheet" id="st"><h2>⚙️ <span data-i="set"></span></h2>
<div class="card"><b data-i="lang"></b><div class="lg" id="lg" style="margin-top:8px"><button data-l="az">AZ</button><button data-l="tr">TR</button><button data-l="ru">RU</button><button data-l="en">EN</button></div></div>
<div class="card"><b data-i="music"></b> <label style="float:right"><input type="checkbox" id="mu"> 🔇</label><div style="margin-top:10px"><span data-i="vol"></span> <input type="range" id="vo" min="0" max="100"></div></div>
<div class="card"><b data-i="sfx"></b> <label style="float:right"><input type="checkbox" id="sm"> 🔇</label><div style="margin-top:10px"><input type="range" id="sv" min="0" max="100"></div><label style="display:block;margin-top:10px"><input type="checkbox" id="hp"> <span data-i="haptic"></span></label></div>
<div class="card"><b data-i="name"></b><div id="nm" style="margin:6px 0;color:var(--ac);font-weight:700"></div><input type="text" id="ni" maxlength="16"><button class="main" id="ns" style="margin-top:8px;padding:10px 18px"></button><div id="nmsg" style="color:var(--mut);margin-top:6px"></div><small style="color:var(--mut)" data-i="nameNote"></small></div>
<div class="card" style="color:var(--mut)" data-i="rules"></div>
<button id="gear" style="display:none;width:100%;padding:12px">🔐 Admin</button></div>
<div id="lose"><div><h2 id="lt"></h2><p id="lp"></p><button class="main" id="pay" style="padding:12px"></button><button id="rs" style="padding:12px"></button><p id="lm" style="color:var(--mut)"></p></div></div>
<div id="pw"><div><h2 id="pwt">Admin şifrəsi</h2><input type="text" id="pwu" placeholder="Giriş" autocomplete="off" autocapitalize="off"><input type="password" id="pwi" placeholder="Şifrə" autocomplete="off"><input type="password" id="pwi2" placeholder="Şifrəni təkrar yazın" style="display:none" autocomplete="off"><p id="pwm"></p><button class="main" id="pwb">Daxil ol</button> <button id="pwc">Ləğv et</button></div></div>
<div id="adm"><h2>⚙️ Admin panel</h2>
<div class="row"><input type="file" id="af" accept="image/*" multiple></div>
<div class="row"><select id="adf"><option value="0">Asan</option><option value="1" selected>Orta</option><option value="2">Çətin</option><option value="3">Çox çətin</option></select>
<select id="aty"><option value="auto">Fərq: avtomatik</option><option value="hue">Rəng dəyişsin</option><option value="clone">Yerinə başqa şey qoy</option><option value="bright">Parlaqlıq</option></select></div>
<div id="ast">Şəkil seçin. Fərqi oyun özü qoyur. İstəsəniz aşağıdakı ikinci şəkildə toxunub yerini özünüz seçin.</div>
<div class="pv"><div><small>Orijinal</small><canvas id="pa"></canvas></div><div><small>Fərqli (toxunub yer seçin)</small><canvas id="pb"></canvas></div></div>
<div class="row"><button id="ar">🎲 Yenidən</button><button id="as" class="main">➕ Səviyyə kimi əlavə et</button><button id="ak">Keç</button></div>
<h3>Bütün səviyyələr</h3><small style="color:var(--mut)">▶ düyməsi sizi həmin səviyyəyə aparır.</small><div id="alist"></div>
<div class="row"><input type="password" id="pn" placeholder="Yeni şifrə" style="flex:1" autocomplete="off"><button id="pnb">Şifrəni dəyiş</button></div><div class="row"><button id="ax">Bağla və kilidlə</button></div></div>
<div id="ov"><div><h2 id="ot"></h2><p id="op"></p><button class="main" id="ob">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const CFG={p:10,n:3,r:10,h0:8,h1:15,h2:40,h3:60};
let st={lvl:1,coins:0};
try{const s=JSON.parse(localStorage.getItem("ferq2")||"null");if(s&&s.lvl)st=s}catch(e){}
const save=()=>{try{localStorage.setItem("ferq2",JSON.stringify(st))}catch(e){}};

/* --- təhlükəsiz SVG --- */
const OK=new Set("g rect circle ellipse path polygon polyline line".split(" "));
const AT=new Set("fill stroke stroke-width d points cx cy r rx ry x y width height x1 y1 x2 y2 transform opacity stroke-linecap stroke-linejoin".split(" "));
function san(n){
  if(!OK.has(n.localName))return null;
  const e=document.createElementNS(NS,n.localName);
  for(const a of n.attributes){if(AT.has(a.name)&&a.value.length<1500&&!/url|javascript|[<&]/i.test(a.value))e.setAttribute(a.name,a.value)}
  for(const c of n.children){const s=san(c);s&&e.appendChild(s)}
  return e}
function parseEls(str){
  try{
    const d=new DOMParser().parseFromString(`<svg xmlns="${NS}">${str}</svg>`,"image/svg+xml");
    if(d.querySelector("parsererror"))return null;
    const g=document.createElementNS(NS,"g");
    for(const c of d.documentElement.children){const s=san(c);s&&g.appendChild(s)}
    return g.childNodes.length?g:null
  }catch(e){return null}}

/* --- yerli ehtiyat kitabxanası --- */
const LIB=[
`<rect x="-1.5" y="2" width="3" height="8" fill="#8b5a2b"/><circle cy="-3" r="7" fill="#2e9d4a"/>`,
`<rect x="-8" y="-1" width="16" height="11" fill="#e8b66a"/><polygon points="-10,-1 0,-9 10,-1" fill="#c0392b"/><rect x="-2" y="4" width="4" height="6" fill="#6b4226"/>`,
`<circle r="6" fill="#ffc83d"/><circle r="3" fill="#ff9f1c"/>`,
`<rect x="-9" y="0" width="18" height="6" rx="2" fill="#e5484d"/><rect x="-5" y="-5" width="10" height="6" rx="2" fill="#e5484d"/><circle cx="-5" cy="7" r="2.5" fill="#222"/><circle cx="5" cy="7" r="2.5" fill="#222"/>`,
`<circle r="6" fill="#3b82f6"/><path d="M-6 0H6" stroke="#fff" stroke-width="1.5"/>`,
`<rect x="-4" y="-5" width="8" height="10" rx="1" fill="#9b5de5"/><path d="M4 -2h3v5h-3" fill="none" stroke="#9b5de5" stroke-width="1.5"/>`,
`<circle r="8" fill="#f1f1f1" stroke="#aaa" stroke-width="1"/><circle r="4.5" fill="#ff9f43"/>`,
`<circle cy="-4" r="3" fill="#ff6b9d"/><circle cx="4" r="3" fill="#ff6b9d"/><circle cy="4" r="3" fill="#ff6b9d"/><circle cx="-4" r="3" fill="#ff6b9d"/><circle r="2.5" fill="#ffd93d"/>`,
`<ellipse rx="9" ry="4" fill="#e8f4ff"/><circle cx="-3" cy="-3" r="4" fill="#e8f4ff"/><circle cx="3" cy="-3" r="3.5" fill="#e8f4ff"/>`,
`<rect x="-6" y="-6" width="12" height="12" fill="#f4a261"/><rect x="-3" y="-3" width="6" height="6" fill="#e76f51"/>`,
`<circle r="6" fill="#e63946"/><path d="M0 -6q1 -4 4 -4" stroke="#2d6a4f" stroke-width="1.5" fill="none"/>`,
`<polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="#fcbf49"/>`];
const BGS=[
`<rect width="100" height="80" fill="#bde6ff"/><rect y="45" width="100" height="35" fill="#8fd18a"/>`,
`<rect width="100" height="80" fill="#f6e3c5"/><rect y="52" width="100" height="28" fill="#c89b6d"/>`,
`<rect width="100" height="80" fill="#fff4e0"/><rect x="4" y="6" width="92" height="68" rx="4" fill="#d9a066"/>`];
function localDef(){
  const bgs=BGS[Math.random()*3|0],rs=[...LIB].sort(()=>Math.random()-.5).slice(0,8);
  return{bg:parseEls(bgs),its:rs.map(parseEls),rs,bgs,theme:"Əyləncəli səhnə"}}

/* --- AI səhnə --- */
const THEMES=["gözəl təbiət mənzərəsi (dağ, ağac, göl, ev, günəş)","küçədə və dayanacaqda maşınlar","yemək süfrəsi (boşqab, stəkan, meyvə, çörək, çəngəl)","oyuncaqlarla dolu uşaq otağı (ayı, top, kubik, qatar, maşın)","akvarium (balıq, bitki, qabıq, balon)","mətbəx (qazan, çaynik, tərəvəz, fincan)","oyun meydançası və park","təmiz dənizkənarı çimərlik","heyvan sürüsü (zebralar, fillər, zürafələr)","sıx meşə (ağaclar, göbələk, quşlar)","gül bağı (müxtəlif rənglərdə güllər, arı, kəpənək)","əsgər dəstəsi (düzülüşdə əsgərlər, bayraq, çadır)"];
async function aiDef(){
  const theme=THEMES[Math.random()*THEMES.length|0];
  try{
    if(!window.claude||!claude.use)return null;
    if(CFG.ai===0)return null;const sm=await claude.use("sample");if(!sm)return null;
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);
    try{
      const v=await sm.json(`Sən "fərq tapma" oyunu üçün səhnə çəkirsən. Mövzu: ${theme}. YALNIZ JSON qaytar, başqa heç nə: {"bg":"...","items":["...","..."]}.
"bg": 100x80 ölçülü fonu çəkən SVG elementləri (sətir). Fonun əhatə etdiyi yer: (0,0)-(100,80).
"items": 8 fərqli əşya, hər biri SVG elementləri sətri kimi, mərkəzi (0,0) olan -10..10 qutusunda çəkilmiş, canlı rənglərlə (boz yox), mövzuya uyğun, tanınan (məs. maşın, ağac, boşqab, oyuncaq ayı).
İcazə verilən teqlər: g, rect, circle, ellipse, path, polygon, polyline, line. Atributlar: fill, stroke, stroke-width, d, points, cx, cy, r, rx, ry, x, y, width, height, x1, y1, x2, y2, transform. Başqa heç nə (text, defs, gradient, url() olmaz). Toxum: ${Math.random()}.`,{signal:ac.signal,modelTier:"default",cache:false});
      if(!v||typeof v.bg!=="string"||!Array.isArray(v.items))return null;
      const rs=v.items.filter(s=>typeof s==="string"&&parseEls(s)),its=rs.map(parseEls);
      const bg=parseEls(v.bg);
      return its.length>=3&&bg?{bg,its,rs,bgs:v.bg,theme:theme.split(" (")[0]}:null
    }finally{clearTimeout(to)}
  }catch(e){return null}}

async function genScene(L){
  let ai=true,def=await aiDef();
  if(!def){ai=false;def=localDef()}
  const n=Math.min(26,4+Math.floor(L*1.2)),k=Math.max(.5,1-n*.02),P=[];
  let t=0;
  while(P.length<n&&t++<1500){
    const x=10+Math.random()*80,y=11+Math.random()*58;
    if(P.every(p=>Math.hypot(p.x-x,p.y-y)>20*k+1||t>1000))P.push({i:Math.random()*def.its.length|0,x,y,k,r:0,hue:0})}
  return{def,P,ai,L}}

/* --- fərq --- */
function mutate(sc){
  const L=sc.L,B=sc.P.map(p=>({...p})),i=Math.random()*B.length|0,q=B[i];
  const ty=["missing","color","size"];if(L>2)ty.push("pos");if(L>4)ty.push("rot");
  const t=ty[Math.random()*ty.length|0];
  if(t==="missing")q.gone=1;
  else if(t==="color")q.hue=Math.max(20,110-L*4);
  else if(t==="size")q.k*=1+Math.max(.15,.55-.03*L);
  else if(t==="pos"){const d=Math.max(2,7-.35*L),g=Math.random()*6.28;q.x+=d*Math.cos(g);q.y+=d*Math.sin(g)}
  else q.r=Math.max(15,60-2*L);
  return{B,D:{x:sc.P[i].x,y:sc.P[i].y,r:10*sc.P[i].k+4}}}

function render(svg,def,P){
  svg.innerHTML="";svg.appendChild(def.bg.cloneNode(true));
  P.forEach(p=>{if(p.gone)return;
    const g=document.createElementNS(NS,"g");
    g.setAttribute("transform",`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.r}) scale(${p.k.toFixed(3)})`);
    if(p.hue)g.style.filter=`hue-rotate(${p.hue}deg)`;
    g.appendChild(def.its[p.i].cloneNode(true));svg.appendChild(g)})}

/* --- oyun --- */
const PH0=[];
const PH=[...PH0];
let sc=null,B=[],D=null,wrong=0,done=true,zone=null,shown=false,pre=null,VH=80;
function setView(h){VH=h;["a","b"].forEach(id=>$(id).setAttribute("viewBox","0 0 100 "+h));$("wrap").className="wrap"+(h>100?" row":"")}
function setMsg(t){$("msg").textContent=t}
function btns(){$("h1").disabled=done||st.coins<15||!!zone;$("h2").disabled=done||st.coins<40||shown;$("h3").disabled=done||st.coins<60}
function mark(x,y,r,col,dash){["a","b"].forEach(id=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("fill","none");c.setAttribute("stroke",col);c.setAttribute("stroke-width",1.6);if(dash)c.setAttribute("stroke-dasharray","3 2");$(id).appendChild(c)})}
function ov(show,t,p,b){$("ov").style.display=show?"flex":"none";if(show){$("ot").textContent=t;$("op").textContent=p;$("ob").textContent=b}}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};

async function start(){
  ov(false);done=true;zone=null;shown=false;wrong=0;
  $("lv").textContent=st.lvl;$("co").textContent=st.coins;
  $("a").innerHTML=$("b").innerHTML="";btns();
  const L=st.lvl,ph=PH[L-1];
  if(!ph){setView(80);setMsg("Hələ heç bir səviyyə yoxdur");$("src").textContent="";done=true;try{upd()}catch(e){}return}
  
  if(ph){

else if(v==="lock"){c+=L.map(x=>x+"{opacity:.5;filter:grayscale(.7)}").join("");if(s.startsWith("#nav"))c+=s+"{position:relative}"+s+"::after{content:'🔒';position:absolute;top:2px;right:6px;font-size:12px}"}});sty.textContent=c}
apply();
function toast(){let o=document.getElementById("fxt");if(o)o.remove();const d=document.createElement("div");d.id="fxt";let l="az";try{l=S.lang||"az"}catch(e){}d.textContent="🔒 "+(SOON[l]||SOON.az);document.body.append(d);setTimeout(()=>d.remove(),1900)}
document.addEventListener("click",e=>{const tg=e.target;if(!tg||!tg.closest)return;for(const [k,,s] of FX){if(ST[k]==="lock"&&tg.closest(s)){e.preventDefault();e.stopImmediatePropagation();toast();return}}},true);
let n1=0;const iv=setInterval(()=>{if(++n1>240)clearInterval(iv);if(typeof DB2==="undefined"||!DB2)return;clearInterval(iv);
DB2.doc("config/features").onSnapshot(s=>{const o=s.data&&s.data();if(o&&o.f&&typeof o.f==="object"){ST=Object.assign({},o.f);cache();apply();render()}},()=>{})},700);
let panel=null,msgEl=null;
function msg(x){if(msgEl)msgEl.textContent=x}
async function setMany(keys,v){const old={...ST};keys.forEach(k=>{ST[k]=v});apply();render();
try{if(typeof DB2==="undefined"||!DB2)throw 0;await DB2.doc("config/features").set({f:ST});cache();msg("✅ Yadda saxlanıldı")}catch(e){cache();msg("⚠ Bazaya yazılmadı, dəyişiklik yalnız bu cihazda görünür. Səbəb: "+((typeof DB2==="undefined"||!DB2)?"baza qoşulmayıb":((e&&(e.code||e.message))||"icazə yoxdur")))}}
const BT=[["show","👁 Göstər"],["hide","🙈 Gizlət"],["lock","🔒 Kilid"]];
function render(){if(!panel)return;const box=panel.querySelector(".fxl");box.replaceChildren();
const mk=(label,keys,cur)=>{const r=document.createElement("div");r.className="fxr";const b=document.createElement("b");b.textContent=label;r.append(b);
BT.forEach(([v,t])=>{const x=document.createElement("button");x.textContent=t;if(cur===v)x.className="on";x.onclick=()=>setMany(keys,v);r.append(x)});box.append(r)};
const all=FX.map(f=>f[0]);const first=(ST[all[0]]||"show");mk("⭐ Hamısı",all,all.every(k=>(ST[k]||"show")===first)?first:"");
FX.forEach(([k,l])=>mk(l,[k],ST[k]||"show"))}
let n2=0;const iv2=setInterval(()=>{if(++n2>600)clearInterval(iv2);const adm=document.getElementById("adm"),bar=document.getElementById("atabs"),ax=document.getElementById("ax");
if(!adm||!bar||!ax||document.getElementById("ap_fx"))return;
panel=document.createElement("div");panel.id="ap_fx";panel.className="aph";
panel.innerHTML='<div class="card"><h3>🎛 Funksiyaları idarə et</h3><p style="color:var(--mut);font-size:13px;margin:4px 0 8px">👁 Göstər — oyunda normal görünür. 🙈 Gizlət — oyunda görünmür. 🔒 Kilid — görünür, amma basanda “Çox yaxında” yazılır.</p><div class="fxl"></div><p class="fxm" style="color:var(--mut);margin-top:8px"></p></div>';
msgEl=panel.querySelector(".fxm");adm.insertBefore(panel,ax.parentElement);
const b=document.createElement("button");b.textContent="🎛 Funksiyalar";[...bar.children].forEach(x=>{if(x.textContent.includes("Təhlükəsizlik"))x.remove()});bar.append(b);
b.onclick=()=>{adm.querySelectorAll('[id^="ap_"]').forEach(p=>p.classList.add("aph"));panel.classList.remove("aph");[...bar.children].forEach(x=>{x.style.background="";x.style.color=""});b.style.background="var(--ac)";b.style.color="#fff";adm.scrollTop=0};
bar.addEventListener("click",e=>{if(e.target!==b&&e.target.tagName==="BUTTON"){panel.classList.add("aph");b.style.background="";b.style.color=""}});
render();clearInterval(iv2);(async()=>{try{const u=await claude.use("user");const ok=u?await u.canEdit():false;if(!ok)msg("⚠ Bu hesabın yazmaq icazəsi yoxdur: dəyişikliklər başqa oyunçulara yayılmaz.")}catch(e){}})()},700);
}catch(e){}})();
</script>
</body>
</html>
